apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: iris-mlops
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: ml-api
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - mlops
            selectors:
              - role: pod
                label: app.kubernetes.io/name=ml-api
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_phase
            action: keep
            regex: Running
          - source_labels:
              - __meta_kubernetes_pod_container_port_name
            action: keep
            regex: http
          - source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace
          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod
