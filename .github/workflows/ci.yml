name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            mlops/requirements.txt
            mlops/requirements-dev.txt
            mlops/requirements-lock.txt

      - name: Install dependencies
        working-directory: mlops
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-lock.txt

      - name: Run tests
        working-directory: mlops
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build --file mlops/Dockerfile --tag iris-mlops:ci mlops
